{% load static %}

<div class="header-wrapper d-flex justify-content-between align-items-center w-100 py-1">
    <!-- سمت چپ: لوگو -->
    <div class="header-left d-flex align-items-center flex-shrink-0">
        <a href="/" class="d-block">
            <img src="{% static 'myassets/myimage/logo/logo.jpeg' %}" alt="پارمی" style="height: 36px; width: auto; display: block;">
        </a>
    </div>

    <!-- سمت راست: دکمه‌ها -->
    <div class="header-right d-flex align-items-center gap-1 flex-shrink-0">
        <!-- دکمه تغییر تم -->
        <button class="btn btn-outline-secondary rounded-circle p-0 d-flex align-items-center justify-content-center theme-btn"
                onclick="toggleTheme()" title="تغییر تم"
                style="width: 34px; height: 34px; border-width: 1.5px;">
            <i class="bi bi-moon" id="headerThemeIcon"></i>
        </button>

        <!-- منوی کاربری -->
        <div class="dropdown">
            {% if user == "none" %}
                <a href="/login/" class="btn btn-primary rounded-circle p-0 d-flex align-items-center justify-content-center login-btn"
                   style="width: 34px; height: 34px;">
                    <i class="bi bi-person"></i>
                </a>
            {% else %}
                <button class="btn btn-outline-secondary rounded-circle p-0 d-flex align-items-center justify-content-center user-btn dropdown-toggle"
                        type="button" data-bs-toggle="dropdown" aria-expanded="false"
                        style="width: 34px; height: 34px; border-width: 1.5px;">
                    <i class="bi bi-person-circle"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li class="nav-item dropdown">
                        <a class="nav-link" href="#" id="alertsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-bell"></i>
                            <span class="badge bg-danger rounded-pill" id="headerAlertCount">0</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="alertsDropdown" id="alertsList">
                            <li><h6 class="dropdown-header">اخطارها</h6></li>
                            <li><hr class="dropdown-divider"></li>
                            <li class="text-center text-muted small">در حال بارگذاری...</li>
                        </ul>
                    </li>
                    <li><a class="dropdown-item" href="/../../profile_settings/{{ user.id }}">
                        <i class="bi bi-person me-2"></i>پروفایل
                    </a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'account:logout' %}">
                        <i class="bi bi-box-arrow-right me-2"></i>خروج
                    </a></li>
                </ul>
            {% endif %}
        </div>
    </div>
</div>

<script>
    // دریافت تعداد اخطارهای خوانده نشده
    function loadUnreadAlerts() {
        fetch('/api/alerts/unread-count/', {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('alertCount').textContent = data.count;
                document.getElementById('headerAlertCount').textContent = data.count;

                // اگر عدد صفر بود، badge را مخفی کنیم
                if (data.count == 0) {
                    document.getElementById('alertCount').style.display = 'none';
                    document.getElementById('headerAlertCount').style.display = 'none';
                } else {
                    document.getElementById('alertCount').style.display = 'inline';
                    document.getElementById('headerAlertCount').style.display = 'inline';
                }
            }
        })
        .catch(error => console.error('Error loading alerts:', error));
    }

    // بارگذاری اولیه
    document.addEventListener('DOMContentLoaded', loadUnreadAlerts);

    // به‌روزرسانی هر ۶۰ ثانیه
    setInterval(loadUnreadAlerts, 60000);

    function toggleTheme() {
        const htmlElement = document.documentElement;
        const icon = document.getElementById('headerThemeIcon');
        const currentTheme = htmlElement.getAttribute('data-bs-theme');

        if (currentTheme === 'dark') {
            htmlElement.setAttribute('data-bs-theme', 'light');
            localStorage.setItem('theme', 'light');
            if (icon) icon.className = 'bi bi-moon';
        } else {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            if (icon) icon.className = 'bi bi-sun';
        }
    }

    // بارگذاری خودکار تم ذخیره شده
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('theme');
        const htmlElement = document.documentElement;
        const icon = document.getElementById('headerThemeIcon');

        if (savedTheme === 'dark') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            if (icon) icon.className = 'bi bi-sun';
        } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            if (icon) icon.className = 'bi bi-moon';
        }
    });
</script>

<style>
    /* ===== تنظیمات سایز آیکون‌ها ===== */
    .header-btn i {
        font-size: 1rem;
        line-height: 1;
    }

    /* ===== هاور دکمه تم ===== */
    .theme-btn:hover {
        background: rgba(249, 115, 22, 0.1) !important;
        border-color: #F97316 !important;
        color: #F97316 !important;
    }

    /* ===== دکمه لاگین ===== */
    .login-btn {
        background: #F97316 !important;
        border-color: #F97316 !important;
        color: white !important;
    }
    .login-btn:hover {
        background: #EA580C !important;
        border-color: #EA580C !important;
        color: white !important;
    }

    /* ===== دکمه کاربر ===== */
    .user-btn::after {
        display: none !important;
    }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width: 576px) {
        .header-left img {
            height: 30px !important;
        }

        .header-btn,
        .theme-btn,
        .login-btn,
        .user-btn {
            width: 30px !important;
            height: 30px !important;
        }

        .header-btn i {
            font-size: 0.85rem !important;
        }

        .header-right {
            gap: 3px !important;
        }
    }

    @media (max-width: 400px) {
        .header-left img {
            height: 26px !important;
        }

        .header-btn,
        .theme-btn,
        .login-btn,
        .user-btn {
            width: 26px !important;
            height: 26px !important;
        }

        .header-btn i {
            font-size: 0.75rem !important;
        }

        .header-right {
            gap: 2px !important;
        }
    }
</style>
