{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراموشی رمز عبور | پارمی - سیستم مدیریت املاک هوشمند</title>

    <!-- فونت و آیکون‌ها -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'index/plugin/swiper/swiper-bundle.min.css' %}">
    <link rel="stylesheet" href="{% static 'index/plugin/go-to-top/style.css' %}">
    <link rel="stylesheet" href="{% static 'index/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'index/css/responsive.css' %}">

    <style>
        /* ============================================================
           استایل‌های صفحه فراموشی رمز عبور پارمی
           ============================================================ */
        :root {
            --primary-purple: #6C2BD9;
            --primary-purple-dark: #5A1FB5;
            --primary-purple-light: #EDE4FF;
            --gold: #FFD700;
            --gold-light: #FFF8E0;
            --teal: #00D4AA;
            --teal-light: #E0FFF7;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            direction: rtl;
            text-align: right;
            background: #F8F7FC;
            min-height: 100vh;
        }

        body.dark-theme {
            background: #0A0A1A;
        }

        .bg-auth {
            background: linear-gradient(135deg, #F8F7FC 0%, #EDE4FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        body.dark-theme .bg-auth {
            background: linear-gradient(135deg, #0A0A1A 0%, #1A0A3A 100%);
        }

        .auth-form {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 32px 28px !important;
            box-shadow: 0 20px 60px rgba(108, 43, 217, 0.08);
            border: 1px solid #E8E4F0;
            transition: all 0.3s ease;
            max-width: 480px;
            width: 100%;
        }
        body.dark-theme .auth-form {
            background: rgba(20, 20, 45, 0.85);
            backdrop-filter: blur(20px);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-form .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .auth-form .logo-wrapper img {
            height: 50px;
            width: auto;
        }
        .auth-form .logo-wrapper .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6C2BD9, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.dark-theme .auth-form .logo-wrapper .brand-name {
            background: linear-gradient(135deg, #8B5CF6, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-form .form-title {
            text-align: center;
            color: #1A1A2E;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        body.dark-theme .auth-form .form-title {
            color: #F1F5F9;
        }

        .auth-form .form-title .highlight {
            color: #6C2BD9;
        }
        body.dark-theme .auth-form .form-title .highlight {
            color: #8B5CF6;
        }
        .auth-form .form-title .sub {
            font-size: 0.75rem;
            font-weight: 400;
            color: #8888AA;
            margin-top: 2px;
        }
        body.dark-theme .auth-form .form-title .sub {
            color: rgba(255, 255, 255, 0.4);
        }

        .comment-item {
            position: relative;
            margin-bottom: 16px;
        }
        .comment-item .form-control {
            width: 100%;
            padding: 14px 14px 4px 14px;
            font-size: 14px;
            border: 2px solid #E8E4F0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background-color: transparent;
            direction: rtl;
            color: #1A1A2E;
            height: 52px;
        }
        body.dark-theme .comment-item .form-control {
            border-color: rgba(255, 255, 255, 0.08);
            color: #F1F5F9;
            background-color: transparent;
        }
        .comment-item .form-control:focus {
            outline: none;
            border-color: #6C2BD9;
            box-shadow: 0 0 0 4px rgba(108, 43, 217, 0.1);
        }
        body.dark-theme .comment-item .form-control:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 4px rgba(108, 43, 217, 0.15);
        }
        .comment-item .form-control::placeholder {
            opacity: 0;
        }
        .comment-item .form-control[dir="ltr"] {
            text-align: left;
        }
        .comment-item .form-control[dir="ltr"] + .form-label.label-float {
            right: 14px;
            text-align: right;
        }

        .comment-item .form-label.label-float {
            position: absolute;
            right: 14px;
            top: 15px;
            font-size: 14px;
            color: #8888AA;
            transition: all 0.2s ease;
            pointer-events: none;
            background-color: transparent;
            padding: 0 4px;
            margin: 0;
            font-weight: 500;
        }
        body.dark-theme .comment-item .form-label.label-float {
            color: rgba(255, 255, 255, 0.4);
        }
        .comment-item .form-control:focus + .form-label.label-float,
        .comment-item .form-control:not(:placeholder-shown) + .form-label.label-float {
            top: -8px;
            right: 10px;
            font-size: 11px;
            color: #6C2BD9;
            background-color: #FFFFFF;
            padding: 0 6px;
            font-weight: 600;
        }
        body.dark-theme .comment-item .form-control:focus + .form-label.label-float,
        body.dark-theme .comment-item .form-control:not(:placeholder-shown) + .form-label.label-float {
            background-color: rgba(20, 20, 45, 0.85);
            color: #8B5CF6;
        }

        .btn-main {
            background: linear-gradient(135deg, #6C2BD9, #8B5CF6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 20px rgba(108, 43, 217, 0.2);
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 43, 217, 0.3);
            color: white;
        }
        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-main .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-left: 8px;
        }
        .btn-main.loading .spinner {
            display: inline-block;
        }
        .btn-main.loading .btn-text {
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-gold {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1A1A2E;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
            color: #1A1A2E;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 0;
            text-align: center;
            display: none;
            background: rgba(220, 53, 69, 0.06);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(220, 53, 69, 0.15);
        }
        body.dark-theme .error-message {
            background: rgba(220, 53, 69, 0.1);
            border-color: rgba(220, 53, 69, 0.2);
        }
        .error-message.show {
            display: block;
        }

        .success-message {
            color: #00b894;
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 0;
            text-align: center;
            display: none;
            background: rgba(0, 184, 148, 0.06);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 184, 148, 0.15);
        }
        body.dark-theme .success-message {
            background: rgba(0, 184, 148, 0.08);
            border-color: rgba(0, 184, 148, 0.2);
        }
        .success-message.show {
            display: block;
        }

        .info-message {
            color: #6C2BD9;
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 0;
            text-align: center;
            display: none;
            background: rgba(108, 43, 217, 0.06);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(108, 43, 217, 0.15);
        }
        body.dark-theme .info-message {
            background: rgba(108, 43, 217, 0.08);
            border-color: rgba(108, 43, 217, 0.2);
        }
        .info-message.show {
            display: block;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            position: relative;
        }
        .step {
            text-align: center;
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .step-number {
            width: 38px;
            height: 38px;
            background-color: var(--bs-tertiary-bg);
            color: #8888AA;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 6px;
            font-weight: 800;
            font-size: 14px;
            border: 2px solid var(--bs-border-color);
            transition: all 0.4s ease;
        }
        body.dark-theme .step-number {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
        }
        .step.active .step-number {
            background: linear-gradient(135deg, #6C2BD9, #8B5CF6);
            color: white;
            border-color: #6C2BD9;
            box-shadow: 0 4px 20px rgba(108, 43, 217, 0.25);
            transform: scale(1.05);
        }
        .step.completed .step-number {
            background: #00b894;
            color: white;
            border-color: #00b894;
        }
        .step-text {
            font-size: 11px;
            color: #8888AA;
            font-weight: 500;
        }
        body.dark-theme .step-text {
            color: rgba(255, 255, 255, 0.3);
        }
        .step.active .step-text {
            color: #6C2BD9;
            font-weight: 700;
        }
        body.dark-theme .step.active .step-text {
            color: #8B5CF6;
        }
        .step.completed .step-text {
            color: #00b894;
        }

        /* خط راهنما بین مراحل */
        .step-indicator::before {
            content: '';
            position: absolute;
            top: 19px;
            right: 15%;
            left: 15%;
            height: 2px;
            background: var(--bs-border-color);
            z-index: 0;
        }
        body.dark-theme .step-indicator::before {
            background: rgba(255, 255, 255, 0.06);
        }
        .step-indicator .step-line {
            position: absolute;
            top: 19px;
            right: 15%;
            height: 2px;
            background: #00b894;
            z-index: 0;
            transition: width 0.5s ease;
            width: 0%;
        }

        .auth-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .auth-link {
            color: #6C2BD9;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            font-size: 13px;
        }
        .auth-link:hover {
            color: #5A1FB5;
            text-decoration: underline;
        }
        body.dark-theme .auth-link {
            color: #8B5CF6;
        }
        body.dark-theme .auth-link:hover {
            color: #C4A0FF;
        }

        .terms-text {
            font-size: 12px;
            color: #8888AA;
            text-align: center;
            margin-top: 16px;
        }
        body.dark-theme .terms-text {
            color: rgba(255, 255, 255, 0.4);
        }
        .terms-text a {
            color: #6C2BD9;
            font-weight: 600;
            text-decoration: none;
        }
        .terms-text a:hover {
            text-decoration: underline;
        }
        body.dark-theme .terms-text a {
            color: #8B5CF6;
        }

        .resend-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .resend-section .resend-link {
            color: #6C2BD9;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .resend-section .resend-link:hover {
            text-decoration: underline;
        }
        body.dark-theme .resend-section .resend-link {
            color: #8B5CF6;
        }
        .resend-section .resend-link.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .resend-section .timer {
            color: #8888AA;
            font-size: 12px;
        }
        body.dark-theme .resend-section .timer {
            color: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 576px) {
            .auth-form {
                padding: 24px 16px !important;
                border-radius: 16px;
            }
            .auth-form .logo-wrapper img {
                height: 40px;
            }
            .auth-form .logo-wrapper .brand-name {
                font-size: 1.2rem;
            }
            .comment-item .form-control {
                height: 46px;
                padding: 12px 12px 4px 12px;
                font-size: 13px;
            }
            .comment-item .form-label.label-float {
                top: 12px;
                font-size: 13px;
                right: 12px;
            }
            .btn-main,
            .btn-gold {
                padding: 12px;
                font-size: 0.85rem;
            }
            .step-indicator {
                gap: 10px;
            }
            .step-text {
                font-size: 9px;
            }
            .step-number {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .step-indicator::before {
                top: 15px;
            }
        }
    </style>
</head>

<body>

<div class="bg-auth">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <div class="auth-form">
                    <!-- ===== لوگو و برند ===== -->
                    <a href="{% url 'home_page' %}">
                        <div class="logo-wrapper">
                            <img src="{% static 'myassets/myimage/logo/logo.jpeg' %}" alt="پارمی">
                            <span class="brand-name">پارمی</span>
                        </div>
                    </a>

                    <!-- ===== عنوان ===== -->
                    <div class="form-title" id="form-title">
                        🔑 فراموشی <span class="highlight">رمز عبور</span>
                        <div class="sub">رمز عبور خود را در ۳ مرحله ساده بازیابی کنید</div>
                    </div>

                    <!-- ===== راهنمای مراحل ===== -->
                    <div class="step-indicator">
                        <div class="step" id="step1">
                            <div class="step-number">۱</div>
                            <div class="step-text">موبایل</div>
                        </div>
                        <div class="step" id="step2">
                            <div class="step-number">۲</div>
                            <div class="step-text">کد تأیید</div>
                        </div>
                        <div class="step" id="step3">
                            <div class="step-number">۳</div>
                            <div class="step-text">رمز جدید</div>
                        </div>
                        <div class="step-line" id="stepLine"></div>
                    </div>

                    <!-- ===== فرم ===== -->
                    <form id="form-forgot" class="py-2">
                        {% csrf_token %}

                        <!-- ===== مرحله ۱: دریافت شماره موبایل ===== -->
                        <div id="step-mobile">
                            <div class="comment-item">
                                <input type="tel" class="form-control" id="mobile" placeholder=" " dir="ltr">
                                <label for="mobile" class="form-label label-float">شماره موبایل</label>
                            </div>
                            <div id="mobile-message" class="mb-2"></div>
                            <div class="text-center">
                                <button type="button" id="btn-send-code" class="btn-main">
                                    <span class="spinner"></span>
                                    <span class="btn-text"><i class="bi bi-send me-2"></i> ارسال کد تأیید</span>
                                </button>
                            </div>
                        </div>

                        <!-- ===== مرحله ۲: تأیید کد ===== -->
                        <div id="step-code" style="display: none;">
                            <div class="comment-item">
                                <input type="text" class="form-control" id="verify_code" placeholder=" " dir="ltr" maxlength="6">
                                <label for="verify_code" class="form-label label-float">کد تأیید</label>
                            </div>
                            <div id="code-message" class="mb-2"></div>

                            <div class="resend-section">
                                <span class="timer" id="timer-display"></span>
                                <a href="#" id="resend-link" class="resend-link disabled">ارسال مجدد کد</a>
                            </div>

                            <div class="text-center">
                                <button type="button" id="btn-verify" class="btn-gold">
                                    <i class="bi bi-check-lg me-2"></i> تأیید کد
                                </button>
                            </div>
                        </div>

                        <!-- ===== مرحله ۳: رمز عبور جدید ===== -->
                        <div id="step-password" style="display: none;">
                            <div class="comment-item">
                                <input type="password" class="form-control" id="new_password" placeholder=" ">
                                <label for="new_password" class="form-label label-float">رمز عبور جدید</label>
                            </div>
                            <div class="comment-item">
                                <input type="password" class="form-control" id="confirm_password" placeholder=" ">
                                <label for="confirm_password" class="form-label label-float">تکرار رمز عبور</label>
                            </div>
                            <div id="password-message" class="mb-2"></div>
                            <div class="text-center">
                                <button type="button" id="btn-reset-password" class="btn-main">
                                    <span class="spinner"></span>
                                    <span class="btn-text"><i class="bi bi-key me-2"></i> بازنشانی رمز عبور</span>
                                </button>
                            </div>
                        </div>

                        <!-- ===== لینک بازگشت ===== -->
                        <div class="auth-links mt-3">
                            <a href="{% url 'account:login' %}" class="auth-link">
                                <i class="bi bi-arrow-right me-1"></i> بازگشت به صفحه ورود
                            </a>
                        </div>

                    </form>

                    <!-- ===== شرایط و قوانین ===== -->
                    <div class="terms-text">
                        با استفاده از پارمی، شما
                        <a href="{% url 'rules' %}">شرایط و قوانین</a>
                        و
                        <a href="{% url 'privacy' %}">حریم خصوصی</a>
                        را می‌پذیرید.
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ============================================================
اسکریپت‌ها
============================================================ -->
<script src="{% static 'index/js/jquery-3.7.1.min.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        let mobileNumber = '';
        let userVerifyCode = '';
        let countdownInterval = null;
        let canResend = true;
        let currentStep = 1;

        // ========== به‌روزرسانی راهنمای مراحل ==========
        function updateStepIndicator(step) {
            const steps = document.querySelectorAll('.step');
            const stepLine = document.getElementById('stepLine');

            steps.forEach((el, index) => {
                const num = index + 1;
                el.classList.remove('active', 'completed');
                if (num < step) {
                    el.classList.add('completed');
                } else if (num === step) {
                    el.classList.add('active');
                }
            });

            // به‌روزرسانی خط راهنما
            if (step === 1) {
                stepLine.style.width = '0%';
            } else if (step === 2) {
                stepLine.style.width = '50%';
            } else if (step === 3) {
                stepLine.style.width = '100%';
            }
        }

        // ========== نمایش پیام ==========
        function showMessage(container, type, text) {
            container.className = type + '-message show';
            container.textContent = text;
        }

        function hideMessage(container) {
            container.className = '';
            container.textContent = '';
        }

        // ========== مرحله ۱: ارسال کد ==========
        function sendVerificationCode() {
            const mobile = document.getElementById('mobile').value.trim();
            const messageContainer = document.getElementById('mobile-message');
            const btn = document.getElementById('btn-send-code');

            hideMessage(messageContainer);

            if (!mobile) {
                showMessage(messageContainer, 'error', '❌ لطفاً شماره موبایل خود را وارد کنید');
                return;
            }
            if (mobile.length < 11) {
                showMessage(messageContainer, 'error', '❌ شماره موبایل باید ۱۱ رقم باشد');
                return;
            }

            // نمایش حالت بارگذاری
            btn.disabled = true;
            btn.classList.add('loading');
            btn.querySelector('.btn-text').innerHTML = '⏳ در حال ارسال...';

            mobileNumber = mobile;

            $.ajax({
                type: 'GET',
                url: '{% url "account:forgot_password" %}',
                data: {
                    i: 'send_code',
                    mobile_number: mobile
                },
                dataType: 'json',
                success: function(data) {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.querySelector('.btn-text').innerHTML = '<i class="bi bi-send me-2"></i> ارسال کد تأیید';

                    if (data['i'] === 1) {
                        showMessage(messageContainer, 'success', '✅ ' + (data['msg'] || 'کد تأیید برای شما ارسال شد'));
                        document.getElementById('step-mobile').style.display = 'none';
                        document.getElementById('step-code').style.display = 'block';
                        currentStep = 2;
                        updateStepIndicator(currentStep);
                        document.getElementById('form-title').innerHTML = '🔐 تأیید <span class="highlight">کد پیامک</span>';
                        startResendTimer(90);
                    } else {
                        showMessage(messageContainer, 'error', '❌ ' + (data['msg'] || 'خطا در ارسال کد'));
                    }
                },
                error: function() {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.querySelector('.btn-text').innerHTML = '<i class="bi bi-send me-2"></i> ارسال کد تأیید';
                    showMessage(messageContainer, 'error', '❌ خطا در ارتباط با سرور. لطفاً مجدداً تلاش کنید.');
                }
            });
        }

        // ========== تایمر ارسال مجدد ==========
        function startResendTimer(seconds) {
            canResend = false;
            const timerDisplay = document.getElementById('timer-display');
            const resendLink = document.getElementById('resend-link');

            resendLink.classList.add('disabled');
            let remaining = seconds;
            timerDisplay.textContent = '⏳ ' + remaining + ' ثانیه';

            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(function() {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    canResend = true;
                    resendLink.classList.remove('disabled');
                    timerDisplay.textContent = '';
                    resendLink.textContent = '🔁 ارسال مجدد کد';
                } else {
                    timerDisplay.textContent = '⏳ ' + remaining + ' ثانیه';
                    resendLink.textContent = 'ارسال مجدد';
                }
            }, 1000);
        }

        // ========== ارسال مجدد کد ==========
        function resendCode() {
            if (!canResend) {
                alert('لطفاً چند ثانیه دیگر صبر کنید');
                return;
            }
            if (!mobileNumber) {
                alert('شماره موبایل یافت نشد');
                return;
            }

            const messageContainer = document.getElementById('code-message');
            hideMessage(messageContainer);
            showMessage(messageContainer, 'info', '⏳ ارسال مجدد کد...');

            $.ajax({
                type: 'GET',
                url: '{% url "account:forgot_password" %}',
                data: {
                    i: 'send_code',
                    mobile_number: mobileNumber
                },
                dataType: 'json',
                success: function(data) {
                    if (data['i'] === 1) {
                        showMessage(messageContainer, 'success', '✅ کد مجدداً ارسال شد');
                        startResendTimer(90);
                    } else {
                        showMessage(messageContainer, 'error', '❌ ' + (data['msg'] || 'خطا در ارسال مجدد'));
                    }
                },
                error: function() {
                    showMessage(messageContainer, 'error', '❌ خطا در ارتباط با سرور');
                }
            });
        }

        // ========== مرحله ۲: تأیید کد ==========
        function verifyCode() {
            const code = document.getElementById('verify_code').value.trim();
            const messageContainer = document.getElementById('code-message');
            const btn = document.getElementById('btn-verify');

            hideMessage(messageContainer);

            if (!code) {
                showMessage(messageContainer, 'error', '❌ لطفاً کد تأیید را وارد کنید');
                return;
            }
            if (code.length < 4) {
                showMessage(messageContainer, 'error', '❌ کد تأیید معتبر نیست (حداقل ۴ رقم)');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> در حال بررسی...';

            userVerifyCode = code;

            $.ajax({
                type: 'GET',
                url: '{% url "account:forgot_password" %}',
                data: {
                    i: 'verify_code',
                    mobile_number: mobileNumber,
                    code: code
                },
                dataType: 'json',
                success: function(data) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check-lg me-2"></i> تأیید کد';

                    if (data['i'] === 1) {
                        showMessage(messageContainer, 'success', '✅ ' + (data['msg'] || 'کد تأیید شد'));
                        document.getElementById('step-code').style.display = 'none';
                        document.getElementById('step-password').style.display = 'block';
                        currentStep = 3;
                        updateStepIndicator(currentStep);
                        document.getElementById('form-title').innerHTML = '🔑 رمز عبور <span class="highlight">جدید</span>';
                        if (countdownInterval) clearInterval(countdownInterval);
                    } else {
                        showMessage(messageContainer, 'error', '❌ ' + (data['msg'] || 'کد تأیید اشتباه است'));
                    }
                },
                error: function() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check-lg me-2"></i> تأیید کد';
                    showMessage(messageContainer, 'error', '❌ خطا در ارتباط با سرور');
                }
            });
        }

        // ========== مرحله ۳: بازنشانی رمز ==========
        function resetPassword() {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const messageContainer = document.getElementById('password-message');
            const btn = document.getElementById('btn-reset-password');

            hideMessage(messageContainer);

            if (!newPassword) {
                showMessage(messageContainer, 'error', '❌ لطفاً رمز عبور جدید را وارد کنید');
                return;
            }
            if (newPassword.length < 4) {
                showMessage(messageContainer, 'error', '❌ رمز عبور باید حداقل ۴ کاراکتر باشد');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage(messageContainer, 'error', '❌ رمز عبور و تکرار آن مطابقت ندارند');
                return;
            }

            btn.disabled = true;
            btn.classList.add('loading');
            btn.querySelector('.btn-text').innerHTML = '⏳ در حال بازنشانی...';

            $.ajax({
                type: 'GET',
                url: '{% url "account:forgot_password" %}',
                data: {
                    i: 'reset_password',
                    mobile_number: mobileNumber,
                    code: userVerifyCode,
                    new_password: newPassword
                },
                dataType: 'json',
                success: function(data) {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.querySelector('.btn-text').innerHTML = '<i class="bi bi-key me-2"></i> بازنشانی رمز عبور';

                    if (data['i'] === 1) {
                        showMessage(messageContainer, 'success', '✅ ' + (data['msg'] || 'رمز عبور با موفقیت تغییر کرد'));
                        setTimeout(function() {
                            window.location.href = '{% url "account:login" %}';
                        }, 2000);
                    } else {
                        showMessage(messageContainer, 'error', '❌ ' + (data['msg'] || 'خطا در تغییر رمز عبور'));
                    }
                },
                error: function() {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.querySelector('.btn-text').innerHTML = '<i class="bi bi-key me-2"></i> بازنشانی رمز عبور';
                    showMessage(messageContainer, 'error', '❌ خطا در ارتباط با سرور');
                }
            });
        }

        // ========== اتصال رویدادها ==========
        document.getElementById('btn-send-code').addEventListener('click', sendVerificationCode);
        document.getElementById('btn-verify').addEventListener('click', verifyCode);
        document.getElementById('btn-reset-password').addEventListener('click', resetPassword);
        document.getElementById('resend-link').addEventListener('click', function(e) {
            e.preventDefault();
            resendCode();
        });

        // ارسال با کلید Enter
        document.getElementById('mobile').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendVerificationCode();
        });
        document.getElementById('verify_code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCode();
        });
        document.getElementById('new_password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') resetPassword();
        });
        document.getElementById('confirm_password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') resetPassword();
        });

        // ===== پشتیبانی از تم تاریک =====
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    });
</script>

</body>
</html>
